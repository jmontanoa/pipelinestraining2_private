name: CI

on:
  # push:
  #   branches: 
  #     - develop
  #     - main
  workflow_dispatch:

env: 
  IMAGE_NAME:  jpmontano/restapp
  SEM_VERSION: "${{ github.ref_name }}-1.0.0_${{ github.run_number }}"
  PYTHON_VERSION: 3.13

jobs:
  ## 🔧 1. Run Unit Tests, code inspections and code coverage
  Static-codecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest test/unit -v

  ## 🔧 2. Build image, Tag image and Push Image to registry
  Build:
    runs-on: ubuntu-latest
    needs: Static-codecheck
    outputs:
      sanitized_ver: ${{ steps.build.outputs.sanitized_ver }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        id: build
        run: |
          sanitized_ver="${SEM_VERSION//\//-}"
          docker build -t $IMAGE_NAME:$sanitized_ver --build-arg PYTHON_VERSION=$PYTHON_VERSION .
          docker push $IMAGE_NAME:$sanitized_ver
          echo "sanitized_ver=$sanitized_ver" >> $GITHUB_OUTPUT

  ## 🚀 3. Deploy to Dev Environment and run Integration tests
  deploy-dev:
    runs-on: self-hosted
    needs: Build
    environment:
      name: Develop
      url: "http://localhost:${{ vars.PORT_APP }}"

    steps:
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Deploy to dev
        run: |
          docker stop $ENV:NAME_REDIS
          docker rm $ENV:NAME_REDIS
          docker run --name $ENV:NAME_REDIS -p "${ENV:PORT_REDIS}:6379" -d redis:alpine
          $redisIP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $ENV:NAME_REDIS)
          $sanitized_ver="${{ needs.build.outputs.sanitized_ver }}"
          docker pull "${ENV:IMAGE_NAME}:$sanitized_ver"
          docker stop $ENV:NAME_APP
          docker rm $ENV:NAME_APP
          docker run --name $ENV:NAME_APP --add-host "redis:$redisIP" -p "${ENV:PORT_APP}:5000" -d "${ENV:IMAGE_NAME}:$sanitized_ver"
        env:
          PORT_APP:   ${{ vars.PORT_APP }}
          PORT_REDIS: ${{ vars.PORT_REDIS }}
          NAME_REDIS: "redis-dev"
          NAME_APP:   "restapp-dev"

      - name: Install GitHub CLI (choco)
        shell: pwsh
        run: choco install gh --version 2.73.0 -y
          
      - name: Create deployment event in GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/deployments `
            -f ref=${{ github.sha }} `
            -f environment=Develop `
            -f auto_merge=false `
            -f required_contexts='[]' `
            -f description="Deploying ${ENV:IMAGE_NAME}:${ENV:SEM_VERSION} to Develop"

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          pip install -r requirements.txt

      - name: Run integration tests against dev
        run: pytest test/integration -v
        env:
          API_BASE_URL: "http://localhost:${{ vars.PORT_APP }}"

      - name: Mark deployment as successful
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deployment_id=$(gh api repos/${{ github.repository }}/deployments --jq '.[0].id')
          gh api repos/${{ github.repository }}/deployments/$deployment_id/statuses \
            -f state=success \
            -f environment=Develop \
            -f description="Deployment completed successfully"

  ## 🚀 4. Deploy to Prod Environment and run Integration tests
  deploy-prod:
    runs-on: self-hosted
    needs: 
      - Build
      - deploy-dev
    environment:
      name: Production
      url: "http://localhost:${{ vars.PORT_APP }}"

    steps:
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Deploy to prod
        run: |
          docker stop $ENV:NAME_REDIS
          docker rm $ENV:NAME_REDIS
          docker run --name $ENV:NAME_REDIS -p "${ENV:PORT_REDIS}:6379" -d redis:alpine
          $redisIP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $ENV:NAME_REDIS)
          $sanitized_ver="${{ needs.build.outputs.sanitized_ver }}"
          docker pull "${ENV:IMAGE_NAME}:$sanitized_ver"
          docker stop $ENV:NAME_APP
          docker rm $ENV:NAME_APP
          docker run --name $ENV:NAME_APP --add-host "redis:$redisIP" -p "${ENV:PORT_APP}:5000" -d "${ENV:IMAGE_NAME}:$sanitized_ver"
        env:
          PORT_APP:   ${{ vars.PORT_APP }}
          PORT_REDIS: ${{ vars.PORT_REDIS }}
          NAME_REDIS: "redis-prod"
          NAME_APP:   "restapp-prod"

      - name: Install GitHub CLI (choco)
        shell: pwsh
        run: choco install gh --version 2.73.0 -y

      - name: Create deployment event in GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/deployments `
            -f ref=${{ github.sha }} `
            -f environment=Production `
            -f auto_merge=false `
            -f required_contexts='[]' `
            -f description="Deploying ${ENV:IMAGE_NAME}:${ENV:SEM_VERSION} to Production"

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          pip install -r requirements.txt

      - name: Run integration tests against prod
        run: pytest test/integration -v
        env:
          API_BASE_URL: "http://localhost:${{ vars.PORT_APP }}"

      - name: Mark deployment as successful
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deployment_id=$(gh api repos/${{ github.repository }}/deployments --jq '.[0].id')
          gh api repos/${{ github.repository }}/deployments/$deployment_id/statuses \
            -f state=success \
            -f environment=Production \
            -f description="Deployment completed successfully"