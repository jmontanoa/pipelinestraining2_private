# .github/workflows/deploy-template.yml
name: Deploy Template

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      app_port:
        required: true
        type: string
      app_name:
        required: true
        type: string
      app_image:
        required: true
        type: string
      redis_image:
        type: string
        default: redis:alpine
      
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url:  "http://localhost:${{ inputs.app_port }}"

    steps:
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Deploy to ${{ inputs.environment }}
        run: |
          docker stop $REDIS_NAME || true
          docker rm $REDIS_NAME || true
          docker run --name $REDIS_NAME -d $REDIS_IMAGE
          redisIP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $REDIS_NAME)
          docker pull $APP_IMAGE
          docker stop $APP_NAME || true
          docker rm $APP_NAME || true
          docker run --name $APP_NAME --add-host "redis:$redisIP" -p "$APP_PORT:5000" -d $APP_IMAGE
        env:
          APP_PORT:    ${{ inputs.app_port }}
          APP_NAME:    ${{ inputs.app_name }}
          APP_IMAGE:   ${{ inputs.app_image }}
          REDIS_NAME:  ${{ inputs.app_name }}_redis
          REDIS_IMAGE: ${{ inputs.redis_image }}
          
      - name: Run integration tests against ${{ inputs.environment }}
        run: docker exec -it $APP_NAME sh -c "python -m pytest test/integration -v"
        env:
          APP_NAME: ${{ inputs.app_name }}

      - name: Mark deployment as successful
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deployment_id=$(gh api repos/${{ github.repository }}/deployments --jq '.[0].id')
          gh api repos/${{ github.repository }}/deployments/$deployment_id/statuses \
            -f state=success \
            -f environment=${{ inputs.environment }} \
            -f description="Deployment completed successfully"