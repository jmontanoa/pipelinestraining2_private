name: CI-Improved

on:
  push:
    branches: 
      - develop
      - main
  workflow_dispatch:

env: 
  IMAGE_NAME: jpmontano/restapp
  NEXT_VERSION: 1.0.0
  PYTHON_VERSION: 3.13

permissions:
  contents: read          # keep this if you need to read/write code
  deployments: write      # <<< this gives your token permission to create deployments

jobs:
  ## 🔧 1. Run Unit Tests, code inspections and code coverage
  Static-codecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest test/unit -v

  ## 🔧 2. Build image, Tag image and Push Image to registry
  Build:
    runs-on: ubuntu-latest
    needs: Static-codecheck
    outputs:
      sanitized_ver: ${{ steps.build.outputs.sanitized_ver }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.2.1
        with:
          versionSpec: '6.0.0'

      - name: Determine Version
        id: version_step # step id used as a reference for output values
        uses: gittools/actions/gitversion/execute@v3.2.1
        with:
          overrideConfig:  |
            next-version=${{ env.NEXT_VERSION }}

      - name: Restore Docker image cache
        id: cache-image
        uses: actions/cache@v3
        with:
          path: docker-cache
          key: ${{ runner.os }}-docker-${{ steps.version_step.outputs.MajorMinorPatch }}           

      - name: Load cached image if any cache was restored
        if: steps.cache-image.outputs.cache-hit == 'true'
        run: |
          echo "Using cache from key: ${{ steps.version_step.outputs.MajorMinorPatch }}"
          docker load -i docker-cache/image.tar

      - name: Build and push Docker image
        id: build
        run: |
          if [ "$CACHE_HIT" != "true" ]; then
            BASE_IMAGE="python:${PYTHON_VERSION}-alpine"
            docker build -t $IMAGE_NAME:$VERSION --build-arg BASE_IMAGE=$BASE_IMAGE --target image-setup .
            docker push $IMAGE_NAME:$VERSION
            mkdir -p docker-cache
            docker save $IMAGE_NAME:$VERSION > docker-cache/image.tar
          fi
          sanitized_ver="${FULL_SEM_VERSION//+/c}"
          BASE_IMAGE="$IMAGE_NAME:$VERSION"
          docker rmi $BASE_IMAGE
          docker build -t $IMAGE_NAME:$sanitized_ver --build-arg BASE_IMAGE=$BASE_IMAGE --target final .
          docker push $IMAGE_NAME:$sanitized_ver
          echo "sanitized_ver=$sanitized_ver" >> $GITHUB_OUTPUT
        env:
          FULL_SEM_VERSION: ${{ steps.version_step.outputs.FullSemVer }}
          VERSION: ${{ steps.version_step.outputs.MajorMinorPatch }}
          CACHE_HIT: ${{ steps.cache-image.outputs.cache-hit }}
        
  ## 🚀 3. Deploy to Dev Environment and run Integration tests
  deploy-dev:
    runs-on: self-hosted
    needs: Build
    environment:
      name: Develop
      url: "http://localhost:${{ vars.PORT_APP }}"

    steps:
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Deploy to dev
        run: |
          docker stop $ENV:NAME_REDIS
          docker rm $ENV:NAME_REDIS
          docker run --name $ENV:NAME_REDIS -p "${ENV:PORT_REDIS}:6379" -d redis:alpine
          $redisIP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $ENV:NAME_REDIS)
          $sanitized_ver="${{ needs.build.outputs.sanitized_ver }}"
          docker pull "${ENV:IMAGE_NAME}:$sanitized_ver"
          docker stop $ENV:NAME_APP
          docker rm $ENV:NAME_APP
          docker run --name $ENV:NAME_APP --add-host "redis:$redisIP" -p "${ENV:PORT_APP}:5000" -d "${ENV:IMAGE_NAME}:$sanitized_ver"
        env:
          PORT_APP:   ${{ vars.PORT_APP }}
          PORT_REDIS: ${{ vars.PORT_REDIS }}
          NAME_REDIS: "redis-dev"
          NAME_APP:   "restapp-dev"

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          pip install -r requirements.txt

      - name: Run integration tests against dev
        run: pytest test/integration -v
        env:
          API_BASE_URL: "http://localhost:${{ vars.PORT_APP }}"

  ## 🚀 4. Deploy to Prod Environment and run Integration tests
  deploy-prod:
    runs-on: self-hosted
    if: ${{ github.ref_name == 'main' }}
    needs: 
      - Build
      - deploy-dev
    environment:
      name: Production
      url: "http://localhost:${{ vars.PORT_APP }}"

    steps:
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Deploy to prod
        run: |
          docker stop $ENV:NAME_REDIS
          docker rm $ENV:NAME_REDIS
          docker run --name $ENV:NAME_REDIS -p "${ENV:PORT_REDIS}:6379" -d redis:alpine
          $redisIP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $ENV:NAME_REDIS)
          $sanitized_ver="${{ needs.build.outputs.sanitized_ver }}"
          docker pull "${ENV:IMAGE_NAME}:$sanitized_ver"
          docker stop $ENV:NAME_APP
          docker rm $ENV:NAME_APP
          docker run --name $ENV:NAME_APP --add-host "redis:$redisIP" -p "${ENV:PORT_APP}:5000" -d "${ENV:IMAGE_NAME}:$sanitized_ver"
        env:
          PORT_APP:   ${{ vars.PORT_APP }}
          PORT_REDIS: ${{ vars.PORT_REDIS }}
          NAME_REDIS: "redis-prod"
          NAME_APP:   "restapp-prod"

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          pip install -r requirements.txt

      - name: Run integration tests against prod
        run: pytest test/integration -v
        env:
          API_BASE_URL: "http://localhost:${{ vars.PORT_APP }}"
