version: '3.13'

services:
  redis_dev:
    image: redis:alpine

  app_dev:
    image: myregistry.com/myuser/myapp:${TAG:-latest}
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      - REDIS_HOST=redis_dev        # 👈 resolves automatically to the `redis_dev` container
      - REDIS_PORT=6379
      - API_BASE_URL=${API_BASE_URL} # 👈 allows running integration tests from `app_dev` container

# - The app container can resolve redis as a hostname (Docker Compose DNS handles it)
#
# - No need for --add-host or extra_hosts
#
# - Everything is isolated in the same bridge network
#
# - ${APP_PORT:-5000} 👈 This is using shell-style variable substitution: Use APP_PORT, or fallback to 5000
#
# - ${TAG:-latest} 👈 This is using shell-style variable substitution: Use TAG, or fallback to latest